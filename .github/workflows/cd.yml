name: CD - Publicar imagen Docker

# Se ejecuta al hacer merge (push) a la rama principal
on:
    push:
        branches: [main]

jobs:
    publish:
        name: Construir y publicar imagen en GHCR
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Descargar codigo
              uses: actions/checkout@v4

            - name: Nombre de la imagen en minusculas
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - name: Configurar Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Iniciar sesion en GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generar etiquetas de la imagen
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=raw,value=latest
                      type=sha,format=short

            - name: Construir y publicar
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

services:
  db:
    image: mysql:8.0
    container_name: votacion-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-sistema_votacion}
      TZ: America/Lima
    ports:
      - "3307:3306"   # 3307 en tu PC para no chocar con un MySQL local en 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: votacion-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:mysql://db:3306/${DB_NAME:-sistema_votacion}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
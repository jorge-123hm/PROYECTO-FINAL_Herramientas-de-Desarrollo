spring.application.name=sistema-votacion

# Carga variables desde un archivo .env local (no se sube a Git)
spring.config.import=optional:file:./.env[.properties]

server.servlet.session.timeout=3600
# Conexión MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_votacion?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate crea las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#reCAPTCHA
recaptcha.site-key=6LehsU4tAAAAADjXL3NtgkhMwH63mlcgJOmOqQLM
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}